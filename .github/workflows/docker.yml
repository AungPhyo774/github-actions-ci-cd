name: Docker CI Pipeline

on:
  push:
    tags:
      - 'v*' 

jobs:

  build:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout Code
        uses: actions/checkout@v4


      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Tag Image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/docker-ci-lab:${{ github.ref_name }} .

          docker tag \
            ${{ secrets.DOCKER_USERNAME }}/docker-ci-lab:${{ github.ref_name }} \
            ${{ secrets.DOCKER_USERNAME }}/docker-ci-lab:latest

      - name: Push Image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/docker-ci-lab:${{ github.ref_name }}
          docker push ${{ secrets.DOCKER_USERNAME }}/docker-ci-lab:latest